name: Actualizar tipo de cambio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-tipocambio.yml"
  schedule:
    - cron: "17 12,15,22 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Consultar BCCR y generar JSON
        env:
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          BCCR_NOMBRE: jimmy
          BCCR_CORREO: jtellezsandoval@gmail.com
        run: |
          python - << 'PY'
          import html
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timedelta
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          token = os.environ.get("BCCR_TOKEN", "").strip()
          nombre = os.environ.get("BCCR_NOMBRE", "").strip()
          correo = os.environ.get("BCCR_CORREO", "").strip()

          zona = ZoneInfo("America/Costa_Rica")
          ahora = datetime.now(zona)
          inicio = (ahora - timedelta(days=7)).strftime("%d/%m/%Y")
          final = ahora.strftime("%d/%m/%Y")
          actualizado = ahora.strftime("%d/%m/%Y %H:%M:%S")

          endpoint = (
              "https://gee.bccr.fi.cr/Indicadores/Suscripciones/WS/"
              "wsindicadoreseconomicos.asmx/ObtenerIndicadoresEconomicosXML"
          )
          pagina_oficial = "https://www.bccr.fi.cr/SitePages/Inicio.aspx"

          def valor_numero(texto):
              texto = texto.strip().replace("\xa0", "")
              if "," in texto and "." not in texto:
                  texto = texto.replace(",", ".")
              elif "," in texto and "." in texto:
                  texto = texto.replace(".", "").replace(",", ".")
              return round(float(texto), 2)

          def fecha_valida(texto):
              texto = texto.strip()
              m = re.search(r"(\d{4}-\d{2}-\d{2})", texto)
              if m:
                  return datetime.strptime(m.group(1), "%Y-%m-%d").date()
              return datetime.strptime(texto[:10], "%d/%m/%Y").date()

          def consultar_ws(indicador):
              if not token:
                  print("BCCR_TOKEN no está configurado; se intentará la fuente oficial de respaldo.")
                  return None

              datos = urlencode({
                  "Indicador": indicador,
                  "FechaInicio": inicio,
                  "FechaFinal": final,
                  "Nombre": nombre,
                  "SubNiveles": "N",
                  "CorreoElectronico": correo,
                  "Token": token,
              }).encode("utf-8")

              for intento, espera in enumerate((0, 5, 15, 30), 1):
                  if espera:
                      print(f"Reintento {intento} en {espera}s para {indicador}...")
                      time.sleep(espera)

                  req = Request(
                      endpoint,
                      data=datos,
                      method="POST",
                      headers={
                          "User-Agent": "GitHub-Actions-Tipo-Cambio-BCCR/3.0",
                          "Accept": "application/xml,text/xml,*/*",
                          "Content-Type": "application/x-www-form-urlencoded",
                      },
                  )

                  try:
                      with urlopen(req, timeout=60) as r:
                          return r.read().decode("utf-8", errors="ignore")
                  except HTTPError as e:
                      print(f"HTTP {e.code}: indicador {indicador}, intento {intento}")
                      if e.code not in (429, 500, 502, 503, 504):
                          return None
                  except (URLError, TimeoutError) as e:
                      print(f"Conexión fallida para {indicador}, intento {intento}: {e}")
                  except Exception as e:
                      print(f"Error inesperado para {indicador}: {e}")
                      return None

              return None

          def extraer_ws(raw, indicador):
              if not raw:
                  return {}

              data = raw
              for _ in range(4):
                  nuevo = html.unescape(data)
                  if nuevo == data:
                      break
                  data = nuevo

              fechas = re.findall(
                  r"<DES_FECHA>\s*(.*?)\s*</DES_FECHA>",
                  data, re.I | re.S
              )
              valores = re.findall(
                  r"<NUM_VALOR>\s*(.*?)\s*</NUM_VALOR>",
                  data, re.I | re.S
              )

              registros = {}
              for f, v in zip(fechas, valores):
                  try:
                      registros[fecha_valida(f)] = valor_numero(v)
                  except (ValueError, TypeError):
                      pass

              print(f"Indicador {indicador}: {len(registros)} registro(s) válido(s).")
              return registros

          def consultar_pagina_oficial():
              print("Intentando fuente oficial alternativa: página principal del BCCR...")

              for intento, espera in enumerate((0, 5, 15), 1):
                  if espera:
                      time.sleep(espera)

                  req = Request(
                      pagina_oficial,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 Chrome/127 Safari/537.36"
                          ),
                          "Accept": "text/html,application/xhtml+xml,*/*",
                          "Accept-Language": "es-CR,es;q=0.9,en;q=0.5",
                      },
                  )

                  try:
                      with urlopen(req, timeout=60) as r:
                          raw = r.read().decode("utf-8", errors="ignore")

                      texto = html.unescape(raw)
                      texto = re.sub(r"<script\b[^>]*>.*?</script>", " ", texto, flags=re.I | re.S)
                      texto = re.sub(r"<style\b[^>]*>.*?</style>", " ", texto, flags=re.I | re.S)
                      texto = re.sub(r"<[^>]+>", " ", texto)
                      texto = re.sub(r"\s+", " ", texto).strip()

                      seccion = texto
                      inicio_sec = re.search(
                          r"TIPO\s+DE\s+CAMBIO\s+DE\s+REFERENCIA\s+Y\s+TASAS",
                          texto,
                          re.I,
                      )
                      if inicio_sec:
                          seccion = texto[inicio_sec.start():inicio_sec.start() + 1200]

                      compra_match = re.search(
                          r"Compra\s+(?:USD\s*)?(?:₡|CRC)?\s*([0-9]{3}[,.][0-9]{2})",
                          seccion,
                          re.I,
                      )
                      venta_match = re.search(
                          r"Venta\s+(?:USD\s*)?(?:₡|CRC)?\s*([0-9]{3}[,.][0-9]{2})",
                          seccion,
                          re.I,
                      )

                      if not compra_match or not venta_match:
                          print(
                              f"Intento {intento}: no se localizaron compra y venta "
                              "en la página oficial."
                          )
                          continue

                      compra = valor_numero(compra_match.group(1))
                      venta = valor_numero(venta_match.group(1))

                      if not (300 <= compra <= 800 and 300 <= venta <= 800 and venta >= compra):
                          print(
                              f"Intento {intento}: valores fuera de rango esperado: "
                              f"compra={compra}, venta={venta}."
                          )
                          continue

                      print("Fuente oficial alternativa consultada correctamente.")
                      return compra, venta

                  except HTTPError as e:
                      print(f"Página oficial BCCR: HTTP {e.code}, intento {intento}")
                  except (URLError, TimeoutError) as e:
                      print(f"Página oficial BCCR: error de conexión, intento {intento}: {e}")
                  except Exception as e:
                      print(f"Página oficial BCCR: error inesperado, intento {intento}: {e}")

              return None

          print(f"Consultando Web Service BCCR desde {inicio} hasta {final}...")
          compras = extraer_ws(consultar_ws("317"), "317")
          ventas = extraer_ws(consultar_ws("318"), "318")

          comunes = sorted(set(compras) & set(ventas), reverse=True)
          fuente = "Web Service del Banco Central de Costa Rica"

          if comunes:
              fecha = comunes[0]
              compra = compras[fecha]
              venta = ventas[fecha]
              fecha_texto = fecha.strftime("%d/%m/%Y")
          else:
              print(
                  "El Web Service no devolvió datos válidos. "
                  "Se activará la fuente oficial de respaldo."
              )
              respaldo = consultar_pagina_oficial()

              if not respaldo:
                  print(
                      "ADVERTENCIA: tampoco fue posible obtener valores desde la "
                      "página oficial. Se conserva el último tipocambio.json válido."
                  )
                  sys.exit(0)

              compra, venta = respaldo
              fecha_texto = ahora.strftime("%d/%m/%Y")
              fuente = "Página oficial del Banco Central de Costa Rica"

          salida = {
              "compra": compra,
              "venta": venta,
              "fecha": fecha_texto,
              "actualizado": actualizado,
              "fuente": fuente,
          }

          with open("tipocambio.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(salida, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("tipocambio.json generado correctamente.")
          print("Compra:", salida["compra"])
          print("Venta:", salida["venta"])
          print("Fecha:", salida["fecha"])
          print("Actualizado:", salida["actualizado"])
          print("Fuente utilizada:", salida["fuente"])
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tipocambio.json

          if git diff --cached --quiet; then
            echo "El archivo no presenta cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza tipo de cambio del BCCR"
          git pull --rebase origin main
          git push origin main
