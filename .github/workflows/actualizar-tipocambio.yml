
name: Actualizar tipo de cambio

on:
  workflow_dispatch:

  # GitHub Actions usa horario UTC.
  # Equivalente en Costa Rica:
  # 6:17 a. m., 9:17 a. m. y 4:17 p. m.
  schedule:
    - cron: "17 12,15,22 * * *"

permissions:
  contents: write

# Evita que una ejecución nueva se cruce con otra que todavía esté activa.
concurrency:
  group: actualizar-tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Consultar BCCR y generar JSON
        env:
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          BCCR_NOMBRE: jimmy
          BCCR_CORREO: jtellezsandoval@gmail.com

        run: |
          python - << 'PY'
          import html
          import json
          import os
          import re
          import sys
          import time

          from datetime import datetime, timedelta
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          token = os.environ.get("BCCR_TOKEN", "").strip()
          nombre = os.environ.get("BCCR_NOMBRE", "").strip()
          correo = os.environ.get("BCCR_CORREO", "").strip()

          if not token:
              print("ERROR: No está configurado el secreto BCCR_TOKEN.")
              sys.exit(1)

          if not nombre or not correo:
              print("ERROR: Faltan BCCR_NOMBRE o BCCR_CORREO.")
              sys.exit(1)

          zona_cr = ZoneInfo("America/Costa_Rica")
          ahora_cr = datetime.now(zona_cr)
          actualizado = ahora_cr.strftime("%d/%m/%Y %H:%M:%S")

          fecha_final = ahora_cr.strftime("%d/%m/%Y")
          fecha_inicio = (ahora_cr - timedelta(days=7)).strftime("%d/%m/%Y")

          endpoint = (
              "https://gee.bccr.fi.cr/Indicadores/Suscripciones/WS/"
              "wsindicadoreseconomicos.asmx/ObtenerIndicadoresEconomicosXML"
          )

          def convertir_valor(valor_texto):
              valor_texto = valor_texto.strip()

              if "," in valor_texto and "." not in valor_texto:
                  valor_texto = valor_texto.replace(",", ".")
              elif "," in valor_texto and "." in valor_texto:
                  valor_texto = valor_texto.replace(",", "")

              return round(float(valor_texto), 2)

          def normalizar_fecha(fecha_texto):
              fecha_texto = fecha_texto.strip()

              formatos = (
                  "%Y-%m-%dT%H:%M:%S",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d",
                  "%d/%m/%Y",
              )

              for formato in formatos:
                  try:
                      return datetime.strptime(fecha_texto[:19], formato).date()
                  except ValueError:
                      continue

              # Algunos XML incluyen fracciones de segundo o zona horaria.
              coincidencia = re.search(r"(\d{4}-\d{2}-\d{2})", fecha_texto)
              if coincidencia:
                  return datetime.strptime(
                      coincidencia.group(1), "%Y-%m-%d"
                  ).date()

              raise ValueError(f"Formato de fecha no reconocido: {fecha_texto}")

          def consultar(indicador):
              params = {
                  "Indicador": indicador,
                  "FechaInicio": fecha_inicio,
                  "FechaFinal": fecha_final,
                  "Nombre": nombre,
                  "SubNiveles": "N",
                  "CorreoElectronico": correo,
                  "Token": token,
              }

              cuerpo = urlencode(params).encode("utf-8")

              esperas = (0, 5, 15, 30)

              for intento, espera in enumerate(esperas, start=1):
                  if espera:
                      print(
                          f"Esperando {espera} segundos antes del intento "
                          f"{intento} para el indicador {indicador}..."
                      )
                      time.sleep(espera)

                  request = Request(
                      endpoint,
                      data=cuerpo,
                      method="POST",
                      headers={
                          "User-Agent": "GitHub-Actions-Tipo-Cambio-BCCR/2.0",
                          "Accept": "application/xml,text/xml,*/*",
                          "Content-Type": "application/x-www-form-urlencoded",
                      },
                  )

                  try:
                      with urlopen(request, timeout=60) as response:
                          raw = response.read().decode(
                              "utf-8", errors="ignore"
                          )

                      print(
                          f"Respuesta recibida para indicador {indicador} "
                          f"en el intento {intento}."
                      )
                      return raw

                  except HTTPError as error:
                      detalle = ""
                      try:
                          detalle = error.read().decode(
                              "utf-8", errors="ignore"
                          )[:500]
                      except Exception:
                          pass

                      print(
                          f"HTTP {error.code}: indicador {indicador}, "
                          f"intento {intento}."
                      )

                      if detalle:
                          print(
                              "Respuesta del servidor (primeros 500 caracteres): "
                              + detalle.replace("\n", " ")
                          )

                      if error.code not in (429, 500, 502, 503, 504):
                          return None

                  except (URLError, TimeoutError) as error:
                      print(
                          f"Error de conexión para indicador {indicador}, "
                          f"intento {intento}: {error}"
                      )

                  except Exception as error:
                      print(
                          f"Error inesperado para indicador {indicador}, "
                          f"intento {intento}: {error}"
                      )
                      return None

              print(
                  f"No fue posible obtener el indicador {indicador} "
                  "después de los reintentos."
              )
              return None

          def extraer_registros(raw, indicador):
              if not raw:
                  return {}

              data = raw
              for _ in range(4):
                  nuevo = html.unescape(data)
                  if nuevo == data:
                      break
                  data = nuevo

              registros = {}

              bloques = re.findall(
                  r"<INGC011_CAT_INDICADORECONOMIC[^>]*>(.*?)"
                  r"</INGC011_CAT_INDICADORECONOMIC[^>]*>",
                  data,
                  re.IGNORECASE | re.DOTALL,
              )

              if not bloques:
                  # Compatibilidad por si el servicio devuelve una estructura
                  # simplificada distinta a la habitual.
                  bloques = re.findall(
                      r"<(?:Table|INGC011_CAT_INDICADORECONOMIC)>"
                      r"(.*?)"
                      r"</(?:Table|INGC011_CAT_INDICADORECONOMIC)>",
                      data,
                      re.IGNORECASE | re.DOTALL,
                  )

              for bloque in bloques:
                  valor_match = re.search(
                      r"<NUM_VALOR>\s*(.*?)\s*</NUM_VALOR>",
                      bloque,
                      re.IGNORECASE | re.DOTALL,
                  )
                  fecha_match = re.search(
                      r"<DES_FECHA>\s*(.*?)\s*</DES_FECHA>",
                      bloque,
                      re.IGNORECASE | re.DOTALL,
                  )

                  if not valor_match or not fecha_match:
                      continue

                  try:
                      fecha = normalizar_fecha(fecha_match.group(1))
                      valor = convertir_valor(valor_match.group(1))
                      registros[fecha] = valor
                  except (TypeError, ValueError) as error:
                      print(
                          f"Registro inválido para indicador {indicador}: {error}"
                      )

              # Respaldo: si la respuesta solo contiene un valor y una fecha.
              if not registros:
                  valores = re.findall(
                      r"<NUM_VALOR>\s*(.*?)\s*</NUM_VALOR>",
                      data,
                      re.IGNORECASE | re.DOTALL,
                  )
                  fechas = re.findall(
                      r"<DES_FECHA>\s*(.*?)\s*</DES_FECHA>",
                      data,
                      re.IGNORECASE | re.DOTALL,
                  )

                  for fecha_texto, valor_texto in zip(fechas, valores):
                      try:
                          fecha = normalizar_fecha(fecha_texto)
                          registros[fecha] = convertir_valor(valor_texto)
                      except (TypeError, ValueError):
                          continue

              print(
                  f"Indicador {indicador}: {len(registros)} registro(s) válido(s)."
              )
              return registros

          print(
              f"Consultando BCCR desde {fecha_inicio} hasta {fecha_final}..."
          )

          compra_raw = consultar("317")
          venta_raw = consultar("318")

          compras = extraer_registros(compra_raw, "317")
          ventas = extraer_registros(venta_raw, "318")

          fechas_comunes = sorted(
              set(compras.keys()) & set(ventas.keys()),
              reverse=True,
          )

          if not fechas_comunes:
              print(
                  "ADVERTENCIA: No fue posible obtener valores nuevos y "
                  "coincidentes del BCCR. Se conservará el último JSON válido."
              )
              sys.exit(0)

          fecha_elegida = fechas_comunes[0]
          compra = compras[fecha_elegida]
          venta = ventas[fecha_elegida]
          fecha_encontrada = fecha_elegida.strftime("%d/%m/%Y")

          salida = {
              "compra": compra,
              "venta": venta,
              "fecha": fecha_encontrada,
              "actualizado": actualizado,
          }

          with open(
              "tipocambio.json",
              "w",
              encoding="utf-8",
              newline="\n",
          ) as archivo:
              json.dump(
                  salida,
                  archivo,
                  ensure_ascii=False,
                  indent=2,
              )
              archivo.write("\n")

          print("tipocambio.json generado correctamente.")
          print(f"Compra: {compra}")
          print(f"Venta: {venta}")
          print(f"Fecha del BCCR: {fecha_encontrada}")
          print(f"Consulta realizada: {actualizado}")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add tipocambio.json

          if git diff --cached --quiet; then
            echo "El archivo no presenta cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza tipo de cambio del BCCR"

          # Descarga cualquier cambio remoto antes de subir el nuevo JSON.
          git pull --rebase origin main
          git push origin main
