name: Actualizar tipo de cambio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-tipocambio.yml"
  schedule:
    - cron: "17 12,15,22 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Consultar BCCR y generar JSON
        env:
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          BCCR_NOMBRE: jimmy
          BCCR_CORREO: jtellezsandoval@gmail.com
        run: |
          python - << 'PY'
          import html
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timedelta
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          token = os.environ.get("BCCR_TOKEN", "").strip()
          nombre = os.environ.get("BCCR_NOMBRE", "").strip()
          correo = os.environ.get("BCCR_CORREO", "").strip()

          zona = ZoneInfo("America/Costa_Rica")
          ahora = datetime.now(zona)
          inicio = (ahora - timedelta(days=10)).strftime("%d/%m/%Y")
          final = ahora.strftime("%d/%m/%Y")
          actualizado = ahora.strftime("%d/%m/%Y %H:%M:%S")

          endpoint = (
              "https://gee.bccr.fi.cr/Indicadores/Suscripciones/WS/"
              "wsindicadoreseconomicos.asmx/ObtenerIndicadoresEconomicosXML"
          )
          pagina_oficial = "https://www.bccr.fi.cr/SitePages/Inicio.aspx"

          def valor_numero(texto):
              texto = texto.strip().replace("\xa0", "").replace("₡", "").replace("CRC", "")
              texto = texto.replace(" ", "")
              if "," in texto and "." not in texto:
                  texto = texto.replace(",", ".")
              elif "," in texto and "." in texto:
                  if texto.rfind(",") > texto.rfind("."):
                      texto = texto.replace(".", "").replace(",", ".")
                  else:
                      texto = texto.replace(",", "")
              return round(float(texto), 2)

          def fecha_valida(texto):
              texto = texto.strip()
              m = re.search(r"(\d{4}-\d{2}-\d{2})", texto)
              if m:
                  return datetime.strptime(m.group(1), "%Y-%m-%d").date()
              m = re.search(r"(\d{2}/\d{2}/\d{4})", texto)
              if m:
                  return datetime.strptime(m.group(1), "%d/%m/%Y").date()
              raise ValueError(f"Fecha no reconocida: {texto}")

          def consultar_ws(indicador):
              if not token:
                  print("BCCR_TOKEN no está configurado; se intentará la fuente oficial de respaldo.")
                  return None

              datos = urlencode({
                  "Indicador": indicador,
                  "FechaInicio": inicio,
                  "FechaFinal": final,
                  "Nombre": nombre,
                  "SubNiveles": "N",
                  "CorreoElectronico": correo,
                  "Token": token,
              }).encode("utf-8")

              for intento, espera in enumerate((0, 5, 15, 30), 1):
                  if espera:
                      print(f"Reintento {intento} en {espera}s para {indicador}...")
                      time.sleep(espera)

                  req = Request(
                      endpoint,
                      data=datos,
                      method="POST",
                      headers={
                          "User-Agent": "GitHub-Actions-Tipo-Cambio-BCCR/4.0",
                          "Accept": "application/xml,text/xml,*/*",
                          "Content-Type": "application/x-www-form-urlencoded",
                      },
                  )

                  try:
                      with urlopen(req, timeout=60) as r:
                          raw = r.read().decode("utf-8", errors="ignore")
                          print(f"WS {indicador}: HTTP {getattr(r, 'status', 200)}, {len(raw)} bytes recibidos.")
                          return raw
                  except HTTPError as e:
                      cuerpo = ""
                      try:
                          cuerpo = e.read().decode("utf-8", errors="ignore")[:300]
                      except Exception:
                          pass
                      print(f"HTTP {e.code}: indicador {indicador}, intento {intento}. Respuesta: {cuerpo!r}")
                      if e.code not in (429, 500, 502, 503, 504):
                          return None
                  except (URLError, TimeoutError) as e:
                      print(f"Conexión fallida para {indicador}, intento {intento}: {e}")
                  except Exception as e:
                      print(f"Error inesperado para {indicador}: {e}")
                      return None

              return None

          def extraer_ws(raw, indicador):
              if not raw:
                  print(f"Indicador {indicador}: sin respuesta utilizable.")
                  return {}

              data = raw
              for _ in range(5):
                  nuevo = html.unescape(data)
                  if nuevo == data:
                      break
                  data = nuevo

              fechas = re.findall(
                  r"<(?:DES_FECHA|DESFECHA)>\s*(.*?)\s*</(?:DES_FECHA|DESFECHA)>",
                  data, re.I | re.S
              )
              valores = re.findall(
                  r"<(?:NUM_VALOR|NUMVALOR)>\s*(.*?)\s*</(?:NUM_VALOR|NUMVALOR)>",
                  data, re.I | re.S
              )

              registros = {}
              for f, v in zip(fechas, valores):
                  try:
                      registros[fecha_valida(f)] = valor_numero(v)
                  except (ValueError, TypeError) as e:
                      print(f"Registro descartado en indicador {indicador}: fecha={f!r}, valor={v!r}, error={e}")

              print(
                  f"Indicador {indicador}: {len(registros)} registro(s) válido(s), "
                  f"{len(fechas)} fecha(s), {len(valores)} valor(es)."
              )
              return registros

          def extraer_valor_etiqueta(texto, etiqueta):
              patrones = [
                  rf"\b{etiqueta}\b\s*(?:USD\s*)?(?:CRC\s*)?(?:₡\s*)?([0-9]{{3}}(?:[.,][0-9]{{2}}))",
                  rf"\b{etiqueta}\b.{{0,120}}?(?:USD\s*)?(?:CRC\s*)?(?:₡\s*)?([0-9]{{3}}(?:[.,][0-9]{{2}}))",
              ]
              for patron in patrones:
                  m = re.search(patron, texto, re.I | re.S)
                  if m:
                      try:
                          return valor_numero(m.group(1))
                      except ValueError:
                          pass
              return None

          def consultar_pagina_oficial():
              print("Intentando fuente oficial alternativa: página principal del BCCR...")

              for intento, espera in enumerate((0, 5, 15), 1):
                  if espera:
                      print(f"Reintento página oficial en {espera}s...")
                      time.sleep(espera)

                  req = Request(
                      pagina_oficial,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) "
                              "Chrome/127.0 Safari/537.36"
                          ),
                          "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                          "Accept-Language": "es-CR,es;q=0.9,en;q=0.5",
                          "Cache-Control": "no-cache",
                      },
                  )

                  try:
                      with urlopen(req, timeout=60) as r:
                          raw = r.read().decode("utf-8", errors="ignore")
                          print(f"Página oficial: HTTP {getattr(r, 'status', 200)}, {len(raw)} bytes recibidos.")

                      texto = html.unescape(raw)
                      texto = re.sub(r"<script\b[^>]*>.*?</script>", " ", texto, flags=re.I | re.S)
                      texto = re.sub(r"<style\b[^>]*>.*?</style>", " ", texto, flags=re.I | re.S)
                      texto = re.sub(r"<[^>]+>", " ", texto)
                      texto = texto.replace("\xa0", " ")
                      texto = re.sub(r"\s+", " ", texto).strip()

                      seccion = texto
                      candidatos = [
                          r"TIPO\s+DE\s+CAMBIO\s+DE\s+REFERENCIA",
                          r"TIPO\s+DE\s+CAMBIO",
                      ]
                      for patron in candidatos:
                          inicio_sec = re.search(patron, texto, re.I)
                          if inicio_sec:
                              seccion = texto[inicio_sec.start():inicio_sec.start() + 3000]
                              break

                      compra = extraer_valor_etiqueta(seccion, "Compra")
                      venta = extraer_valor_etiqueta(seccion, "Venta")

                      if compra is None or venta is None:
                          compra = compra if compra is not None else extraer_valor_etiqueta(texto, "Compra")
                          venta = venta if venta is not None else extraer_valor_etiqueta(texto, "Venta")

                      if compra is None or venta is None:
                          print(
                              f"Intento {intento}: no se localizaron compra y venta. "
                              f"Compra={compra}, Venta={venta}."
                          )
                          continue

                      if not (300 <= compra <= 800 and 300 <= venta <= 800 and venta >= compra):
                          print(
                              f"Intento {intento}: valores fuera de rango esperado: "
                              f"compra={compra}, venta={venta}."
                          )
                          continue

                      print(
                          "Fuente oficial alternativa consultada correctamente: "
                          f"compra={compra}, venta={venta}."
                      )
                      return compra, venta

                  except HTTPError as e:
                      print(f"Página oficial BCCR: HTTP {e.code}, intento {intento}")
                  except (URLError, TimeoutError) as e:
                      print(f"Página oficial BCCR: error de conexión, intento {intento}: {e}")
                  except Exception as e:
                      print(f"Página oficial BCCR: error inesperado, intento {intento}: {e}")

              return None

          print("=" * 70)
          print("ACTUALIZACIÓN DEL TIPO DE CAMBIO BCCR")
          print(f"Fecha/hora Costa Rica: {actualizado}")
          print(f"Periodo consultado: {inicio} a {final}")
          print("=" * 70)

          compras = extraer_ws(consultar_ws("317"), "317")
          ventas = extraer_ws(consultar_ws("318"), "318")

          comunes = sorted(set(compras) & set(ventas), reverse=True)
          fuente = "Web Service del Banco Central de Costa Rica"

          if comunes:
              fecha = comunes[0]
              compra = compras[fecha]
              venta = ventas[fecha]
              fecha_texto = fecha.strftime("%d/%m/%Y")
              print(
                  f"Web Service OK: fecha={fecha_texto}, "
                  f"compra={compra}, venta={venta}."
              )
          else:
              print(
                  "El Web Service no devolvió datos comunes válidos para compra y venta. "
                  "Se activará la fuente oficial de respaldo."
              )
              respaldo = consultar_pagina_oficial()

              if not respaldo:
                  print(
                      "ERROR: no fue posible obtener valores ni desde el Web Service "
                      "ni desde la página oficial del BCCR."
                  )
                  print(
                      "Se conserva el último tipocambio.json válido, pero el workflow "
                      "se marcará como fallido para que el problema sea visible."
                  )
                  sys.exit(1)

              compra, venta = respaldo
              fecha_texto = ahora.strftime("%d/%m/%Y")
              fuente = "Página oficial del Banco Central de Costa Rica"

          salida = {
              "compra": compra,
              "venta": venta,
              "fecha": fecha_texto,
              "actualizado": actualizado,
              "fuente": fuente,
          }

          with open("tipocambio.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(salida, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("=" * 70)
          print("tipocambio.json generado correctamente.")
          print("Compra:", salida["compra"])
          print("Venta:", salida["venta"])
          print("Fecha:", salida["fecha"])
          print("Actualizado:", salida["actualizado"])
          print("Fuente utilizada:", salida["fuente"])
          print("=" * 70)
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tipocambio.json

          if git diff --cached --quiet; then
            echo "El archivo no presenta cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza tipo de cambio del BCCR"
          git pull --rebase origin main
          git push origin main
