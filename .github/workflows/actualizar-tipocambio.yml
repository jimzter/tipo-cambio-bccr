name: Actualizar tipo de cambio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-tipocambio.yml"
  schedule:
    - cron: "17 12,15,22 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Consultar BCCR y generar JSON
        env:
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          BCCR_NOMBRE: jimmy
          BCCR_CORREO: jtellezsandoval@gmail.com
        run: |
          python - << 'PY'
          import html
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timedelta
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          from playwright.sync_api import sync_playwright

          zona = ZoneInfo("America/Costa_Rica")
          ahora = datetime.now(zona)
          inicio_dt = ahora - timedelta(days=10)
          inicio = inicio_dt.strftime("%d/%m/%Y")
          final = ahora.strftime("%d/%m/%Y")
          actualizado = ahora.strftime("%d/%m/%Y %H:%M:%S")

          token = os.environ.get("BCCR_TOKEN", "").strip()
          nombre = os.environ.get("BCCR_NOMBRE", "").strip()
          correo = os.environ.get("BCCR_CORREO", "").strip()

          WS_BASE = "https://gee.bccr.fi.cr/Indicadores/Suscripciones/WS/wsindicadoreseconomicos.asmx"
          WS_XML = WS_BASE + "/ObtenerIndicadoresEconomicosXML"
          WS_DATASET = WS_BASE + "/ObtenerIndicadoresEconomicos"
          CUADRO_URL = (
              "https://gee.bccr.fi.cr/indicadoreseconomicos/Cuadros/frmVerCatCuadro.aspx"
              "?CodCuadro=400&FecInicial=" + inicio_dt.strftime("%Y/%m/%d") +
              "&FecFinal=" + ahora.strftime("%Y/%m/%d") +
              "&Filtro=0&Idioma=1"
          )
          HOME_URL = "https://www.bccr.fi.cr/"

          def valor_numero(texto):
              t = texto.strip().replace("\xa0", "").replace("₡", "").replace("CRC", "")
              t = t.replace(" ", "")
              if "," in t and "." not in t:
                  t = t.replace(",", ".")
              elif "," in t and "." in t:
                  if t.rfind(",") > t.rfind("."):
                      t = t.replace(".", "").replace(",", ".")
                  else:
                      t = t.replace(",", "")
              return round(float(t), 2)

          def parse_fecha(texto):
              m = re.search(r"(\d{4}-\d{2}-\d{2})", texto)
              if m:
                  return datetime.strptime(m.group(1), "%Y-%m-%d").date()
              m = re.search(r"(\d{1,2})\s+(Ene|Feb|Mar|Abr|May|Jun|Jul|Ago|Sep|Set|Oct|Nov|Dic)\s+(\d{4})", texto, re.I)
              if m:
                  meses = {"ene":1,"feb":2,"mar":3,"abr":4,"may":5,"jun":6,"jul":7,"ago":8,"sep":9,"set":9,"oct":10,"nov":11,"dic":12}
                  return datetime(int(m.group(3)), meses[m.group(2).lower()], int(m.group(1))).date()
              m = re.search(r"(\d{2}/\d{2}/\d{4})", texto)
              if m:
                  return datetime.strptime(m.group(1), "%d/%m/%Y").date()
              return None

          def extraer_registros_xml(raw):
              if not raw:
                  return {}
              data = raw
              for _ in range(5):
                  nuevo = html.unescape(data)
                  if nuevo == data:
                      break
                  data = nuevo
              fechas = re.findall(r"<(?:DES_FECHA|DESFECHA)>\s*(.*?)\s*</(?:DES_FECHA|DESFECHA)>", data, re.I | re.S)
              valores = re.findall(r"<(?:NUM_VALOR|NUMVALOR)>\s*(.*?)\s*</(?:NUM_VALOR|NUMVALOR)>", data, re.I | re.S)
              registros = {}
              for f, v in zip(fechas, valores):
                  try:
                      fecha = parse_fecha(f)
                      if fecha:
                          registros[fecha] = valor_numero(v)
                  except Exception:
                      pass
              return registros

          def pedir(url, data=None, timeout=60):
              req = Request(
                  url,
                  data=data,
                  method="POST" if data is not None else "GET",
                  headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml,text/xml,*/*",
                      "Accept-Language": "es-CR,es;q=0.9,en;q=0.5",
                      "Content-Type": "application/x-www-form-urlencoded" if data is not None else "text/html",
                  },
              )
              with urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def consultar_ws(indicador):
              if not token:
                  print("BCCR_TOKEN no configurado; se omite WS.")
                  return {}

              params = {
                  "Indicador": indicador,
                  "FechaInicio": inicio,
                  "FechaFinal": final,
                  "Nombre": nombre,
                  "SubNiveles": "N",
                  "CorreoElectronico": correo,
                  "Token": token,
              }
              data = urlencode(params).encode("utf-8")

              # 1) XML por POST
              for intento, espera in enumerate((0, 5, 15), 1):
                  if espera:
                      time.sleep(espera)
                  try:
                      raw = pedir(WS_XML, data)
                      regs = extraer_registros_xml(raw)
                      if regs:
                          print(f"WS XML {indicador}: {len(regs)} registros.")
                          return regs
                  except HTTPError as e:
                      print(f"WS XML {indicador}: HTTP {e.code}, intento {intento}")
                  except Exception as e:
                      print(f"WS XML {indicador}: {e}")

              # 2) DataSet por GET como alternativa oficial
              try:
                  url = WS_DATASET + "?" + urlencode(params)
                  raw = pedir(url)
                  regs = extraer_registros_xml(raw)
                  if regs:
                      print(f"WS DataSet {indicador}: {len(regs)} registros.")
                      return regs
              except Exception as e:
                  print(f"WS DataSet {indicador}: {e}")

              return {}

          def extraer_cuadro_texto(texto):
              lineas = [re.sub(r"\s+", " ", x).strip() for x in texto.splitlines() if x.strip()]
              fechas = []
              numeros = []
              for linea in lineas:
                  f = parse_fecha(linea)
                  if f:
                      fechas.append(f)
                      continue
                  if re.fullmatch(r"\d{3}[,.]\d{2,5}", linea):
                      try:
                          numeros.append(valor_numero(linea))
                      except Exception:
                          pass
              if not fechas or len(numeros) < len(fechas) * 2:
                  return None
              n = len(fechas)
              compras = numeros[:n]
              ventas = numeros[n:n*2]
              candidatos = [(f, compras[i], ventas[i]) for i, f in enumerate(fechas) if f <= ahora.date()]
              if not candidatos:
                  return None
              f, compra, venta = max(candidatos, key=lambda x: x[0])
              if 300 <= compra <= 800 and 300 <= venta <= 800 and venta >= compra:
                  return f, compra, venta
              return None

          def extraer_home_texto(texto):
              limpio = re.sub(r"\s+", " ", texto)
              mc = re.search(r"Compra\s+USD\s*₡?\s*([0-9]{3}[,.][0-9]{2})", limpio, re.I)
              mv = re.search(r"Venta\s+USD\s*₡?\s*([0-9]{3}[,.][0-9]{2})", limpio, re.I)
              if not mc or not mv:
                  mc = re.search(r"\bCompra\b.{0,80}?([0-9]{3}[,.][0-9]{2})", limpio, re.I)
                  mv = re.search(r"\bVenta\b.{0,80}?([0-9]{3}[,.][0-9]{2})", limpio, re.I)
              if not mc or not mv:
                  return None
              compra = valor_numero(mc.group(1))
              venta = valor_numero(mv.group(1))
              if 300 <= compra <= 800 and 300 <= venta <= 800 and venta >= compra:
                  return ahora.date(), compra, venta
              return None

          def consultar_con_navegador():
              print("Intentando respaldo oficial con navegador Chromium...")
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(locale="es-CR")

                  # Cuadro 400
                  try:
                      print("Abriendo Cuadro 400:", CUADRO_URL)
                      page.goto(CUADRO_URL, wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(3000)
                      texto = page.locator("body").inner_text(timeout=10000)
                      print("Cuadro 400: caracteres visibles:", len(texto))
                      r = extraer_cuadro_texto(texto)
                      if r:
                          browser.close()
                          print("Cuadro 400 OK:", r)
                          return r, "Cuadro 400 del Banco Central de Costa Rica"
                  except Exception as e:
                      print("Cuadro 400 con navegador falló:", e)

                  # Página principal oficial
                  try:
                      print("Abriendo página principal BCCR:", HOME_URL)
                      page.goto(HOME_URL, wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(5000)
                      texto = page.locator("body").inner_text(timeout=10000)
                      print("Página principal: caracteres visibles:", len(texto))
                      r = extraer_home_texto(texto)
                      if r:
                          browser.close()
                          print("Página principal BCCR OK:", r)
                          return r, "Página oficial del Banco Central de Costa Rica"
                  except Exception as e:
                      print("Página principal BCCR con navegador falló:", e)

                  browser.close()
              return None

          print("=" * 70)
          print("ACTUALIZACIÓN DEL TIPO DE CAMBIO BCCR")
          print("Fecha/hora Costa Rica:", actualizado)
          print("Periodo:", inicio, "a", final)
          print("=" * 70)

          compras = consultar_ws("317")
          ventas = consultar_ws("318")
          comunes = sorted(set(compras) & set(ventas), reverse=True)

          if comunes:
              fecha = comunes[0]
              compra = compras[fecha]
              venta = ventas[fecha]
              fuente = "Web Service del Banco Central de Costa Rica"
          else:
              respaldo = consultar_con_navegador()
              if not respaldo:
                  print("ERROR: no fue posible obtener datos válidos desde las fuentes oficiales del BCCR.")
                  sys.exit(1)
              (fecha, compra, venta), fuente = respaldo

          salida = {
              "compra": compra,
              "venta": venta,
              "fecha": fecha.strftime("%d/%m/%Y"),
              "actualizado": actualizado,
              "fuente": fuente,
          }

          with open("tipocambio.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(salida, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("tipocambio.json generado:")
          print(json.dumps(salida, ensure_ascii=False, indent=2))
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tipocambio.json

          if git diff --cached --quiet; then
            echo "El archivo no presenta cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza tipo de cambio del BCCR"
          git pull --rebase origin main
          git push origin main
