name: Actualizar tipo de cambio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-tipocambio.yml"
  schedule:
    - cron: "17 12,15,22 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Consultar cuadro oficial unificado del BCCR
        run: |
          python - << 'PY'
          import json
          import re
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from playwright.sync_api import sync_playwright

          ZONA = ZoneInfo("America/Costa_Rica")
          AHORA = datetime.now(ZONA)
          HOY = AHORA.date()
          ACTUALIZADO = AHORA.strftime("%d/%m/%Y %H:%M:%S")

          URL = "https://sdd.bccr.fi.cr/es/IndicadoresEconomicos/Inicio/Contenedor/6?Cuadro=1"

          MESES = {
              "ene": 1, "enero": 1,
              "feb": 2, "febrero": 2,
              "mar": 3, "marzo": 3,
              "abr": 4, "abril": 4,
              "may": 5, "mayo": 5,
              "jun": 6, "junio": 6,
              "jul": 7, "julio": 7,
              "ago": 8, "agosto": 8,
              "sep": 9, "sept": 9, "set": 9,
              "septiembre": 9, "setiembre": 9,
              "oct": 10, "octubre": 10,
              "nov": 11, "noviembre": 11,
              "dic": 12, "diciembre": 12,
          }

          def parse_fecha(texto):
              t = re.sub(r"\s+", " ", texto.strip())

              m = re.search(r"(\d{1,2})[/-](\d{1,2})[/-](\d{4})", t)
              if m:
                  return datetime(int(m.group(3)), int(m.group(2)), int(m.group(1))).date()

              m = re.search(
                  r"(\d{1,2})\s+(ene(?:ro)?|feb(?:rero)?|mar(?:zo)?|abr(?:il)?|may(?:o)?|jun(?:io)?|jul(?:io)?|ago(?:sto)?|sep(?:tiembre)?|sept(?:iembre)?|set(?:iembre)?|oct(?:ubre)?|nov(?:iembre)?|dic(?:iembre)?)\s+(\d{4})",
                  t,
                  re.I,
              )
              if m:
                  clave = m.group(2).lower()
                  mes = MESES.get(clave)
                  if mes is None:
                      mes = MESES.get(clave[:3])
                  if mes:
                      return datetime(int(m.group(3)), mes, int(m.group(1))).date()
              return None

          def parse_valor(texto):
              t = texto.strip().replace("\xa0", "").replace("₡", "").replace("CRC", "").replace(" ", "")
              m = re.search(r"(?<!\d)(\d{3,4}[,.]\d{1,5})(?!\d)", t)
              if not m:
                  return None
              n = m.group(1)
              if "," in n and "." not in n:
                  n = n.replace(",", ".")
              elif "," in n and "." in n:
                  if n.rfind(",") > n.rfind("."):
                      n = n.replace(".", "").replace(",", ".")
                  else:
                      n = n.replace(",", "")
              try:
                  v = round(float(n), 2)
                  return v if 300 <= v <= 800 else None
              except Exception:
                  return None

          def extraer_matriz_tabla(page):
              tablas = page.locator("table")
              print("Tablas detectadas:", tablas.count())

              for ti in range(tablas.count()):
                  tabla = tablas.nth(ti)
                  filas = tabla.locator("tr")
                  matriz = []
                  for fi in range(filas.count()):
                      celdas = filas.nth(fi).locator("th, td")
                      fila = []
                      for ci in range(celdas.count()):
                          try:
                              fila.append(re.sub(r"\s+", " ", celdas.nth(ci).inner_text(timeout=3000)).strip())
                          except Exception:
                              fila.append("")
                      if fila:
                          matriz.append(fila)

                  texto = " ".join(" | ".join(f) for f in matriz).lower()
                  if "compra" in texto and "venta" in texto:
                      print(f"Tabla candidata #{ti}:")
                      for f in matriz:
                          print("  ", f)
                      return matriz
              return None

          def localizar_series(matriz):
              fila_fechas = None
              fila_compra = None
              fila_venta = None

              for fila in matriz:
                  fechas_en_fila = [parse_fecha(c) for c in fila]
                  if sum(1 for f in fechas_en_fila if f) >= 1:
                      fila_fechas = fila

                  if any(re.search(r"\bcompra\b", c, re.I) for c in fila):
                      fila_compra = fila
                  if any(re.search(r"\bventa\b", c, re.I) for c in fila):
                      fila_venta = fila

              if not fila_fechas or not fila_compra or not fila_venta:
                  return None

              registros = {}
              max_cols = min(len(fila_fechas), len(fila_compra), len(fila_venta))
              for i in range(max_cols):
                  fecha = parse_fecha(fila_fechas[i])
                  if not fecha:
                      continue
                  compra = parse_valor(fila_compra[i])
                  venta = parse_valor(fila_venta[i])
                  if compra is None or venta is None:
                      continue
                  if venta < compra:
                      continue
                  registros[fecha] = (compra, venta)

              return registros or None

          def extraer_por_texto(page):
              texto = page.locator("body").inner_text(timeout=15000)
              lineas = [re.sub(r"\s+", " ", x).strip() for x in texto.splitlines() if x.strip()]

              fechas = []
              for linea in lineas:
                  f = parse_fecha(linea)
                  if f:
                      fechas.append(f)

              fechas = list(dict.fromkeys(fechas))

              compra_vals = []
              venta_vals = []
              for i, linea in enumerate(lineas):
                  if re.fullmatch(r"Compra", linea, re.I):
                      for x in lineas[i + 1:i + 10]:
                          if re.fullmatch(r"Venta", x, re.I):
                              break
                          v = parse_valor(x)
                          if v is not None:
                              compra_vals.append(v)
                  if re.fullmatch(r"Venta", linea, re.I):
                      for x in lineas[i + 1:i + 10]:
                          v = parse_valor(x)
                          if v is not None:
                              venta_vals.append(v)

              if not fechas or not compra_vals or not venta_vals:
                  return None

              n = min(len(fechas), len(compra_vals), len(venta_vals))
              registros = {}
              for i in range(n):
                  c = compra_vals[i]
                  v = venta_vals[i]
                  if v >= c:
                      registros[fechas[i]] = (c, v)
              return registros or None

          print("=" * 70)
          print("TIPO DE CAMBIO BCCR - CUADRO OFICIAL UNIFICADO")
          print("Fecha/hora Costa Rica:", ACTUALIZADO)
          print("Fecha efectiva buscada:", HOY.strftime("%d/%m/%Y"))
          print("Fuente:", URL)
          print("=" * 70)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(locale="es-CR", timezone_id="America/Costa_Rica")
              page = context.new_page()
              resp = page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              print("HTTP:", resp.status if resp else "sin respuesta")
              try:
                  page.wait_for_load_state("networkidle", timeout=25000)
              except Exception:
                  pass
              page.wait_for_timeout(5000)

              matriz = extraer_matriz_tabla(page)
              registros = localizar_series(matriz) if matriz else None
              if not registros:
                  print("No se pudo interpretar la tabla DOM; intentando texto visible.")
                  registros = extraer_por_texto(page)

              browser.close()

          if not registros:
              print("ERROR: no fue posible extraer compra y venta del Cuadro=1.")
              sys.exit(1)

          print("Registros encontrados:")
          for f in sorted(registros):
              print(f"  {f.strftime('%d/%m/%Y')}: compra={registros[f][0]} venta={registros[f][1]}")

          # Regla clave: usar la fecha efectiva de Costa Rica. El BCCR puede publicar
          # anticipadamente el tipo de cambio del día siguiente, pero no debe mostrarse
          # hasta que esa fecha llegue.
          if HOY in registros:
              fecha = HOY
          else:
              anteriores = [f for f in registros if f <= HOY]
              if not anteriores:
                  print("ERROR: el cuadro no contiene un dato vigente para hoy ni una fecha anterior.")
                  sys.exit(1)
              fecha = max(anteriores)

          compra, venta = registros[fecha]

          salida = {
              "compra": compra,
              "venta": venta,
              "fecha": fecha.strftime("%d/%m/%Y"),
              "actualizado": ACTUALIZADO,
              "fuente": "Cuadro 1 de la Plataforma SDD de Indicadores Económicos del Banco Central de Costa Rica",
          }

          with open("tipocambio.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(salida, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("tipocambio.json generado:")
          print(json.dumps(salida, ensure_ascii=False, indent=2))
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tipocambio.json

          if git diff --cached --quiet; then
            echo "El archivo no presenta cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza tipo de cambio del Cuadro 1 del BCCR"
          git pull --rebase origin main
          git push origin main
