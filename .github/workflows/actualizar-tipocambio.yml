name: Actualizar tipo de cambio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-tipocambio.yml"
  schedule:
    - cron: "17 12,15,22 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Consultar BCCR y generar JSON
        env:
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          BCCR_NOMBRE: jimmy
          BCCR_CORREO: jtellezsandoval@gmail.com
        run: |
          python - << 'PY'
          import html
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timedelta
          from html.parser import HTMLParser
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          ZONA = ZoneInfo("America/Costa_Rica")
          ahora = datetime.now(ZONA)
          desde = ahora - timedelta(days=10)
          inicio = desde.strftime("%d/%m/%Y")
          final = ahora.strftime("%d/%m/%Y")
          actualizado = ahora.strftime("%d/%m/%Y %H:%M:%S")

          token = os.environ.get("BCCR_TOKEN", "").strip()
          nombre = os.environ.get("BCCR_NOMBRE", "").strip()
          correo = os.environ.get("BCCR_CORREO", "").strip()

          WS_URL = (
              "https://gee.bccr.fi.cr/Indicadores/Suscripciones/WS/"
              "wsindicadoreseconomicos.asmx/ObtenerIndicadoresEconomicosXML"
          )

          cuadro_params = urlencode({
              "CodCuadro": "400",
              "FecInicial": desde.strftime("%Y/%m/%d"),
              "FecFinal": ahora.strftime("%Y/%m/%d"),
              "Filtro": "0",
              "Idioma": "1",
          })
          CUADRO_URL = (
              "https://gee.bccr.fi.cr/indicadoreseconomicos/Cuadros/"
              f"frmVerCatCuadro.aspx?{cuadro_params}"
          )

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.partes = []

              def handle_data(self, data):
                  data = data.strip()
                  if data:
                      self.partes.append(data)

          def valor_numero(texto):
              t = texto.strip().replace("\xa0", "").replace("₡", "")
              t = t.replace("CRC", "").replace(" ", "")
              if "," in t and "." not in t:
                  t = t.replace(",", ".")
              elif "," in t and "." in t:
                  if t.rfind(",") > t.rfind("."):
                      t = t.replace(".", "").replace(",", ".")
                  else:
                      t = t.replace(",", "")
              return round(float(t), 2)

          def fecha_ws(texto):
              texto = texto.strip()
              m = re.search(r"(\d{4}-\d{2}-\d{2})", texto)
              if m:
                  return datetime.strptime(m.group(1), "%Y-%m-%d").date()
              m = re.search(r"(\d{2}/\d{2}/\d{4})", texto)
              if m:
                  return datetime.strptime(m.group(1), "%d/%m/%Y").date()
              raise ValueError(f"Fecha no reconocida: {texto}")

          def request(url, data=None, timeout=60):
              req = Request(
                  url,
                  data=data,
                  method="POST" if data is not None else "GET",
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/127.0 Safari/537.36"
                      ),
                      "Accept": "text/html,application/xhtml+xml,application/xml,text/xml,*/*",
                      "Accept-Language": "es-CR,es;q=0.9,en;q=0.5",
                      "Cache-Control": "no-cache",
                      "Content-Type": "application/x-www-form-urlencoded" if data else "text/html",
                  },
              )
              with urlopen(req, timeout=timeout) as r:
                  raw = r.read().decode("utf-8", errors="ignore")
                  print(f"HTTP {getattr(r, 'status', 200)} - {len(raw)} bytes")
                  return raw

          def consultar_ws(indicador):
              if not token:
                  print("BCCR_TOKEN no está configurado; se omite Web Service.")
                  return {}

              datos = urlencode({
                  "Indicador": indicador,
                  "FechaInicio": inicio,
                  "FechaFinal": final,
                  "Nombre": nombre,
                  "SubNiveles": "N",
                  "CorreoElectronico": correo,
                  "Token": token,
              }).encode("utf-8")

              raw = None
              for intento, espera in enumerate((0, 5, 15), 1):
                  if espera:
                      print(f"Reintento WS {indicador} en {espera}s...")
                      time.sleep(espera)
                  try:
                      raw = request(WS_URL, datos)
                      break
                  except HTTPError as e:
                      print(f"WS {indicador}: HTTP {e.code}, intento {intento}")
                      if e.code not in (429, 500, 502, 503, 504):
                          break
                  except (URLError, TimeoutError) as e:
                      print(f"WS {indicador}: error de conexión, intento {intento}: {e}")

              if not raw:
                  return {}

              data = raw
              for _ in range(5):
                  nuevo = html.unescape(data)
                  if nuevo == data:
                      break
                  data = nuevo

              fechas = re.findall(
                  r"<(?:DES_FECHA|DESFECHA)>\s*(.*?)\s*</(?:DES_FECHA|DESFECHA)>",
                  data, re.I | re.S
              )
              valores = re.findall(
                  r"<(?:NUM_VALOR|NUMVALOR)>\s*(.*?)\s*</(?:NUM_VALOR|NUMVALOR)>",
                  data, re.I | re.S
              )

              registros = {}
              for f, v in zip(fechas, valores):
                  try:
                      registros[fecha_ws(f)] = valor_numero(v)
                  except Exception as e:
                      print(f"WS {indicador}: registro descartado {f!r}/{v!r}: {e}")

              print(f"WS {indicador}: {len(registros)} registro(s) válido(s).")
              return registros

          MESES = {
              "ene": 1, "feb": 2, "mar": 3, "abr": 4,
              "may": 5, "jun": 6, "jul": 7, "ago": 8,
              "sep": 9, "set": 9, "oct": 10, "nov": 11, "dic": 12,
          }

          def parse_fecha_cuadro(texto):
              m = re.fullmatch(
                  r"(\d{1,2})\s+(Ene|Feb|Mar|Abr|May|Jun|Jul|Ago|Sep|Set|Oct|Nov|Dic)\s+(\d{4})",
                  texto.strip(), re.I
              )
              if not m:
                  return None
              return datetime(
                  int(m.group(3)), MESES[m.group(2).lower()], int(m.group(1))
              ).date()

          def consultar_cuadro_oficial():
              print("Intentando respaldo: Cuadro 400 oficial del BCCR con rango de fechas...")
              print(f"Rango cuadro: {desde.strftime('%Y/%m/%d')} a {ahora.strftime('%Y/%m/%d')}")

              raw = None
              for intento, espera in enumerate((0, 5, 15), 1):
                  if espera:
                      print(f"Reintento cuadro oficial en {espera}s...")
                      time.sleep(espera)
                  try:
                      raw = request(CUADRO_URL)
                      break
                  except HTTPError as e:
                      print(f"Cuadro oficial: HTTP {e.code}, intento {intento}")
                  except (URLError, TimeoutError) as e:
                      print(f"Cuadro oficial: error de conexión, intento {intento}: {e}")

              if not raw:
                  return None

              parser = TextExtractor()
              parser.feed(html.unescape(raw))
              tokens = [re.sub(r"\s+", " ", x).strip() for x in parser.partes]

              inicio_idx = 0
              fin_idx = len(tokens)
              for i, t in enumerate(tokens):
                  if "TIPO CAMBIO COMPRA" in t.upper():
                      inicio_idx = i
                      break
              for i in range(inicio_idx, len(tokens)):
                  if tokens[i].upper().startswith("FUENTE"):
                      fin_idx = i
                      break

              zona = tokens[inicio_idx:fin_idx]
              fechas = []
              numeros = []

              for t in zona:
                  f = parse_fecha_cuadro(t)
                  if f:
                      fechas.append(f)
                      continue
                  if re.fullmatch(r"\d{3}[,.]\d{2,5}", t):
                      try:
                          numeros.append(valor_numero(t))
                      except ValueError:
                          pass

              print(
                  f"Cuadro oficial: {len(fechas)} fecha(s) y "
                  f"{len(numeros)} valor(es) detectados."
              )

              if not fechas or len(numeros) < len(fechas) * 2:
                  print("Cuadro oficial: estructura inesperada.")
                  print("Primeros tokens detectados:", tokens[:40])
                  return None

              n = len(fechas)
              compras = numeros[:n]
              ventas = numeros[n:n * 2]

              candidatos = [
                  (f, compras[i], ventas[i])
                  for i, f in enumerate(fechas)
                  if f <= ahora.date()
              ]
              if not candidatos:
                  return None

              f, compra, venta = max(candidatos, key=lambda x: x[0])

              if not (300 <= compra <= 800 and 300 <= venta <= 800 and venta >= compra):
                  print(
                      "Cuadro oficial: valores fuera de rango: "
                      f"fecha={f}, compra={compra}, venta={venta}"
                  )
                  return None

              print(
                  "Cuadro oficial OK: "
                  f"fecha={f.strftime('%d/%m/%Y')}, compra={compra}, venta={venta}"
              )
              return f, compra, venta

          print("=" * 70)
          print("ACTUALIZACIÓN DEL TIPO DE CAMBIO BCCR")
          print(f"Fecha/hora Costa Rica: {actualizado}")
          print(f"Periodo WS: {inicio} a {final}")
          print("=" * 70)

          compras_ws = consultar_ws("317")
          ventas_ws = consultar_ws("318")
          comunes = sorted(set(compras_ws) & set(ventas_ws), reverse=True)

          if comunes:
              fecha = comunes[0]
              compra = compras_ws[fecha]
              venta = ventas_ws[fecha]
              fuente = "Web Service del Banco Central de Costa Rica"
              print(
                  f"Web Service OK: {fecha.strftime('%d/%m/%Y')} "
                  f"compra={compra}, venta={venta}"
              )
          else:
              print("Web Service no disponible o sin datos comunes; usando respaldo oficial.")
              respaldo = consultar_cuadro_oficial()
              if not respaldo:
                  print("ERROR: no fue posible obtener el tipo de cambio desde ninguna fuente oficial.")
                  print("Se conserva el último tipocambio.json válido.")
                  sys.exit(1)

              fecha, compra, venta = respaldo
              fuente = "Cuadro 400 de Indicadores Económicos del Banco Central de Costa Rica"

          salida = {
              "compra": compra,
              "venta": venta,
              "fecha": fecha.strftime("%d/%m/%Y"),
              "actualizado": actualizado,
              "fuente": fuente,
          }

          with open("tipocambio.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(salida, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("=" * 70)
          print("tipocambio.json generado correctamente")
          print(json.dumps(salida, ensure_ascii=False, indent=2))
          print("=" * 70)
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tipocambio.json

          if git diff --cached --quiet; then
            echo "El archivo no presenta cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza tipo de cambio del BCCR"
          git pull --rebase origin main
          git push origin main
