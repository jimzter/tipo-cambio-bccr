name: Actualizar tipo de cambio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-tipocambio.yml"
  schedule:
    - cron: "17 12,15,22 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Consultar BCCR y generar JSON
        env:
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          BCCR_NOMBRE: jimmy
          BCCR_CORREO: jtellezsandoval@gmail.com
        run: |
          python - << 'PY'
          import html
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timedelta
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          from playwright.sync_api import sync_playwright

          zona = ZoneInfo("America/Costa_Rica")
          ahora = datetime.now(zona)
          inicio_dt = ahora - timedelta(days=10)
          inicio = inicio_dt.strftime("%d/%m/%Y")
          final = ahora.strftime("%d/%m/%Y")
          actualizado = ahora.strftime("%d/%m/%Y %H:%M:%S")

          token = os.environ.get("BCCR_TOKEN", "").strip()
          nombre = os.environ.get("BCCR_NOMBRE", "").strip()
          correo = os.environ.get("BCCR_CORREO", "").strip()

          WS_BASE = "https://gee.bccr.fi.cr/Indicadores/Suscripciones/WS/wsindicadoreseconomicos.asmx"
          WS_XML = WS_BASE + "/ObtenerIndicadoresEconomicosXML"
          WS_DATASET = WS_BASE + "/ObtenerIndicadoresEconomicos"

          # Nuevas páginas oficiales enlazadas desde www.bccr.fi.cr
          SDD_COMPRA = "https://sdd.bccr.fi.cr/es/IndicadoresEconomicos/Inicio/Contenedor/124?Cuadro=488"
          SDD_VENTA = "https://sdd.bccr.fi.cr/es/IndicadoresEconomicos/Inicio/Contenedor/125?Cuadro=491"

          def valor_numero(texto):
              t = texto.strip().replace("\xa0", "").replace("₡", "").replace("CRC", "")
              t = t.replace(" ", "")
              if "," in t and "." not in t:
                  t = t.replace(",", ".")
              elif "," in t and "." in t:
                  if t.rfind(",") > t.rfind("."):
                      t = t.replace(".", "").replace(",", ".")
                  else:
                      t = t.replace(",", "")
              return round(float(t), 2)

          MESES = {
              "ene":1,"enero":1,"feb":2,"febrero":2,"mar":3,"marzo":3,
              "abr":4,"abril":4,"may":5,"mayo":5,"jun":6,"junio":6,
              "jul":7,"julio":7,"ago":8,"agosto":8,"sep":9,"set":9,
              "septiembre":9,"setiembre":9,"oct":10,"octubre":10,
              "nov":11,"noviembre":11,"dic":12,"diciembre":12,
          }

          def parse_fecha(texto):
              texto = texto.strip()
              m = re.search(r"(\d{4}-\d{2}-\d{2})", texto)
              if m:
                  return datetime.strptime(m.group(1), "%Y-%m-%d").date()
              m = re.search(r"(\d{1,2})[/-](\d{1,2})[/-](\d{4})", texto)
              if m:
                  return datetime(int(m.group(3)), int(m.group(2)), int(m.group(1))).date()
              m = re.search(
                  r"(\d{1,2})\s+(Ene(?:ro)?|Feb(?:rero)?|Mar(?:zo)?|Abr(?:il)?|May(?:o)?|Jun(?:io)?|Jul(?:io)?|Ago(?:sto)?|Sep(?:tiembre)?|Set(?:iembre)?|Oct(?:ubre)?|Nov(?:iembre)?|Dic(?:iembre)?)\s+(\d{4})",
                  texto, re.I
              )
              if m:
                  mes = MESES.get(m.group(2).lower())
                  if mes:
                      return datetime(int(m.group(3)), mes, int(m.group(1))).date()
              return None

          def extraer_registros_xml(raw):
              if not raw:
                  return {}
              data = raw
              for _ in range(5):
                  nuevo = html.unescape(data)
                  if nuevo == data:
                      break
                  data = nuevo
              fechas = re.findall(r"<(?:DES_FECHA|DESFECHA)>\s*(.*?)\s*</(?:DES_FECHA|DESFECHA)>", data, re.I | re.S)
              valores = re.findall(r"<(?:NUM_VALOR|NUMVALOR)>\s*(.*?)\s*</(?:NUM_VALOR|NUMVALOR)>", data, re.I | re.S)
              registros = {}
              for f, v in zip(fechas, valores):
                  try:
                      fecha = parse_fecha(f)
                      valor = valor_numero(v)
                      if fecha and 300 <= valor <= 800:
                          registros[fecha] = valor
                  except Exception:
                      pass
              return registros

          def pedir(url, data=None, timeout=60):
              req = Request(
                  url,
                  data=data,
                  method="POST" if data is not None else "GET",
                  headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml,text/xml,*/*",
                      "Accept-Language": "es-CR,es;q=0.9,en;q=0.5",
                      "Content-Type": "application/x-www-form-urlencoded" if data is not None else "text/html",
                  },
              )
              with urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def consultar_ws(indicador):
              if not token:
                  print("BCCR_TOKEN no configurado; se omite WS.")
                  return {}

              params = {
                  "Indicador": indicador,
                  "FechaInicio": inicio,
                  "FechaFinal": final,
                  "Nombre": nombre,
                  "SubNiveles": "N",
                  "CorreoElectronico": correo,
                  "Token": token,
              }
              data = urlencode(params).encode("utf-8")

              for intento, espera in enumerate((0, 5, 15), 1):
                  if espera:
                      time.sleep(espera)
                  try:
                      raw = pedir(WS_XML, data)
                      regs = extraer_registros_xml(raw)
                      if regs:
                          print(f"WS XML {indicador}: {len(regs)} registros.")
                          return regs
                  except HTTPError as e:
                      print(f"WS XML {indicador}: HTTP {e.code}, intento {intento}")
                  except Exception as e:
                      print(f"WS XML {indicador}: {e}")

              try:
                  raw = pedir(WS_DATASET + "?" + urlencode(params))
                  regs = extraer_registros_xml(raw)
                  if regs:
                      print(f"WS DataSet {indicador}: {len(regs)} registros.")
                      return regs
              except Exception as e:
                  print(f"WS DataSet {indicador}: {e}")

              return {}

          def extraer_serie_sdd(texto, etiqueta):
              lineas = [re.sub(r"\s+", " ", x).strip() for x in texto.splitlines() if x.strip()]
              registros = {}

              # Caso 1: fecha y valor están en la misma línea.
              for linea in lineas:
                  fecha = parse_fecha(linea)
                  if not fecha:
                      continue
                  nums = re.findall(r"(?<!\d)(\d{3}[,.]\d{2,5})(?!\d)", linea)
                  for num in nums:
                      try:
                          valor = valor_numero(num)
                          if 300 <= valor <= 800:
                              registros[fecha] = valor
                              break
                      except Exception:
                          pass

              # Caso 2: tabla con fecha en una línea y valor en líneas cercanas.
              for i, linea in enumerate(lineas):
                  fecha = parse_fecha(linea)
                  if not fecha or fecha in registros:
                      continue
                  for prox in lineas[i + 1:i + 9]:
                      nums = re.findall(r"(?<!\d)(\d{3}[,.]\d{2,5})(?!\d)", prox)
                      encontrado = False
                      for num in nums:
                          try:
                              valor = valor_numero(num)
                              if 300 <= valor <= 800:
                                  registros[fecha] = valor
                                  encontrado = True
                                  break
                          except Exception:
                              pass
                      if encontrado or parse_fecha(prox):
                          break

              print(f"SDD {etiqueta}: {len(registros)} registro(s) detectado(s).")
              if not registros:
                  print(f"SDD {etiqueta}: primeras líneas visibles:")
                  for x in lineas[:40]:
                      print("  ", x[:250])
              return registros

          def consultar_sdd_con_navegador():
              print("Intentando respaldo oficial en la nueva plataforma SDD del BCCR...")
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(locale="es-CR")
                  page = context.new_page()

                  def abrir(url, etiqueta):
                      print(f"Abriendo SDD {etiqueta}: {url}")
                      try:
                          resp = page.goto(url, wait_until="domcontentloaded", timeout=60000)
                          print(f"SDD {etiqueta}: HTTP", resp.status if resp else "sin respuesta")
                          try:
                              page.wait_for_load_state("networkidle", timeout=20000)
                          except Exception:
                              pass
                          page.wait_for_timeout(5000)
                          texto = page.locator("body").inner_text(timeout=15000)
                          print(f"SDD {etiqueta}: {len(texto)} caracteres visibles.")
                          return extraer_serie_sdd(texto, etiqueta)
                      except Exception as e:
                          print(f"SDD {etiqueta}: error al abrir/leer: {e}")
                          return {}

                  compras = abrir(SDD_COMPRA, "compra")
                  ventas = abrir(SDD_VENTA, "venta")
                  browser.close()

              comunes = sorted(set(compras) & set(ventas), reverse=True)
              if not comunes:
                  print("SDD: no se encontraron fechas comunes entre compra y venta.")
                  return None

              fecha = comunes[0]
              compra = compras[fecha]
              venta = ventas[fecha]
              if not (300 <= compra <= 800 and 300 <= venta <= 800 and venta >= compra):
                  print(f"SDD: valores inválidos: {fecha=} {compra=} {venta=}")
                  return None

              print(f"SDD OK: {fecha.strftime('%d/%m/%Y')} compra={compra} venta={venta}")
              return fecha, compra, venta

          print("=" * 70)
          print("ACTUALIZACIÓN DEL TIPO DE CAMBIO BCCR")
          print("Fecha/hora Costa Rica:", actualizado)
          print("Periodo:", inicio, "a", final)
          print("=" * 70)

          compras = consultar_ws("317")
          ventas = consultar_ws("318")
          comunes = sorted(set(compras) & set(ventas), reverse=True)

          if comunes:
              fecha = comunes[0]
              compra = compras[fecha]
              venta = ventas[fecha]
              fuente = "Web Service del Banco Central de Costa Rica"
          else:
              respaldo = consultar_sdd_con_navegador()
              if not respaldo:
                  print("ERROR: no fue posible obtener datos válidos desde las fuentes oficiales del BCCR.")
                  sys.exit(1)
              fecha, compra, venta = respaldo
              fuente = "Plataforma SDD de Indicadores Económicos del Banco Central de Costa Rica"

          salida = {
              "compra": compra,
              "venta": venta,
              "fecha": fecha.strftime("%d/%m/%Y"),
              "actualizado": actualizado,
              "fuente": fuente,
          }

          with open("tipocambio.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(salida, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("tipocambio.json generado:")
          print(json.dumps(salida, ensure_ascii=False, indent=2))
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tipocambio.json

          if git diff --cached --quiet; then
            echo "El archivo no presenta cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza tipo de cambio del BCCR"
          git pull --rebase origin main
          git push origin main
